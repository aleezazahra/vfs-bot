  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon="{&quot;version&quot;:&quot;2024.11.0&quot;,&quot;token&quot;:&quot;9ef1911bcdeb4feebca92a9083af1b7e&quot;}" crossorigin="anonymous"></script>

  <script>
    let param = window.location.href.split("&issuer=");
    let issuer = country = "";
    if (param.length === 2) {
        issuer = param[1].toString();
        country = issuer.substr(0, 2);
        localStorage.setItem("issuer", issuer);
        localStorage.setItem("country", country);
    } else {
        issuer = localStorage.getItem("issuer");
        country = localStorage.getItem("country");
    }
    if (issuer && country) {
      document.getElementsByClassName("tls-logo")[0].href="https://visas-fr.tlscontact.com" + "/visa/" + country + "/" + issuer + "/home";
      if (document.getElementById("form-back-homepage")) {
        document.getElementById("form-back-homepage").href="https://visas-fr.tlscontact.com" + "/visa/" + country + "/" + issuer + "/home";
      }
    }

    // Generate navbar navigation bar
    let navbarFilter = { 'application_center.code': {'eq': localStorage.getItem("issuer")}, 'status': {'eq': 'published'}};
    directusSDKClient
        .getItems('navbar', { fields: '*.*', filter: navbarFilter, lang: language })
        .then(response => {
            if (response.data.length > 0 && response.data[0].translation.length > 0) {
                const translation = response.data[0].translation[0];
                let navbarHtml = '';
                Object.keys(translation.menu).forEach(function (key) {
                    if (translation.menu[key].hasOwnProperty('items')) {
                        navbarHtml += this.createDropDownNavbar(translation.menu[key].title, translation.menu[key].items);
                    } else {
                        navbarHtml += this.createNormalNavbar(translation.menu[key].link, translation.menu[key].title);
                    }
                });
                document.getElementsByClassName('tls-navbar--links')[0].innerHTML += navbarHtml;
            } else {
                console.error('Error while loading translation');
            }
        })
        .catch(error => {
            console.error(error);
        });

    function chevronUp (element) {
        element.getElementsByTagName('img')[0].src = "/auth/resources/kozhl/login/web/img/chevron-up.svg";
        element.lastElementChild.removeAttribute('style');
    }
    function chevronDown(element) {
        element.getElementsByTagName('img')[0].src = "/auth/resources/kozhl/login/web/img/chevron-down.svg";
        element.lastElementChild.setAttribute('style', 'display:none');
    }

    function createNormalNavbar(link, title) {
        let html = '';
        html += '<a href="https://visas-fr.tlscontact.com' + link + '" class="tls-link-dropdown">' + title + '</a>';
        return '<div class="tls-navbar--slot"><div class="tls-dropdown">'+html+'</div></div>';
    }

    function createDropDownNavbar(title, items) {
        let html = '';
        let navbarTiele = '<a class="tls-link-dropdown">' +
            '    <div class="tls-link-dropdown--text">' + title + '</div>' +
            '    <div class="tls-link-dropdown--icon">' +
            '    <img src="/auth/resources/kozhl/login/web/img/chevron-down.svg" alt="">' +
            '    </div>' +
            '</a>';

        var HideContent = '';
        Object.keys(items).forEach(function (key) {
            HideContent += '<div class="tls-dropdown-list--slot">' +
                '    <a href="https://visas-fr.tlscontact.com' + items[key].link + '" class="tls-dropdown-text router-link-exact-active router-link-active">' + items[key].title + '</a>' +
                '</div>';
        });
        html += '<div class="tls-navbar--slot"><div class="tls-dropdown" onmouseover="chevronUp(this)" onmouseout="chevronDown(this)">'+ navbarTiele +'<div class="tls-dropdown--content" style="display: none"><div class="tls-dropdown-list">' + HideContent + '</div></div></div></div>';

        return html;
    }

    window.addEventListener('click', function (event) {
      if (document.getElementById('tlsNavbarHamburger').contains(event.target)) {
        hamburgerToggle();
        event.stopPropagation();
      } else {
        if (!document.getElementById("tlsHamburger").classList.contains('-state-closed')) {
          hamburgerToggle();
          event.stopPropagation();
        }
      }
    });

    function hamburgerToggle() {
      var hamburgerItems = document.getElementById("tlsHamburger");
      hamburgerItems.classList.toggle("-state-closed");
      hamburgerItems.classList.toggle("-state-opened");

      var navbarLinksItems = document.getElementById("tlsNavbarLinks");
      navbarLinksItems.classList.toggle("-closed");
      navbarLinksItems.classList.toggle("-opened");
    }
  </script>
